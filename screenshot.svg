<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" style="background:radial-gradient(circle at 20% 30%,#030712,#000)">
  <rect x="0" y="0" width="800" height="500" fill="none"/>
  <rect x="25" y="20" width="750" height="55" rx="12" fill="rgba(5,12,24,.7)" stroke="rgba(0,116,255,.4)" stroke-width="1"/>
  <text x="45" y="55" fill="#eef2ff" font-family="monospace" font-size="14" font-weight="bold">AYMAN ELMASRY</text>
  <text x="175" y="55" fill="#8db7ff" font-family="monospace" font-size="11">AEL Digital Studio</text>

  <text x="400" y="115" fill="#fff" font-family="monospace" font-size="26" font-weight="bold" text-anchor="middle">3D Particle Backgrounds Library</text>
  <text x="400" y="140" fill="#9ab3e6" font-family="monospace" font-size="12" text-anchor="middle">1,000+ curated AI prompts for particle background generation with interactive 3D canvas</text>

  <circle cx="100" cy="175" r="25" fill="none" stroke="rgba(0,116,255,.15)" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="0 100 175" to="360 100 175" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="175" r="25" fill="none" stroke="#0074FF" stroke-width="1" stroke-dasharray="10 67" opacity=".4">
    <animateTransform attributeName="transform" type="rotate" from="0 100 175" to="360 100 175" dur="60s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="175" r="6" fill="#0074FF" opacity=".6"/>

  <rect x="150" y="160" width="600" height="32" rx="8" fill="rgba(1,5,14,.7)" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
  <text x="165" y="181" fill="#4a5a7a" font-family="monospace" font-size="12">Search prompts by keyword...</text>

  <rect x="50" y="210" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1"/>
  <text x="65" y="230" fill="#0074FF" font-family="monospace" font-size="10">3D Particle System — Cosmic Dust</text>
  <text x="65" y="248" fill="#fff" font-family="monospace" font-size="11">A cosmic dust particle system with millions of tiny luminous particles drifting through deep space, creating an ethereal nebula effect with subtle color shifting...</text>
  <circle cx="365" cy="232" r="10" fill="rgba(0,116,255,.15)"/>
  <text x="365" y="236" fill="#0074FF" font-family="monospace" font-size="9" text-anchor="middle">🔒</text>

  <rect x="415" y="210" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1"/>
  <text x="430" y="230" fill="#0074FF" font-family="monospace" font-size="10">3D Particle System — Aurora Waves</text>
  <text x="430" y="248" fill="#fff" font-family="monospace" font-size="11">Undulating aurora borealis-inspired wave patterns composed of thousands of glowing particles flowing in synchronized motion across a dark arctic sky...</text>
  <circle cx="730" cy="232" r="10" fill="rgba(0,116,255,.15)"/>
  <text x="730" y="236" fill="#0074FF" font-family="monospace" font-size="9" text-anchor="middle">🔒</text>

  <rect x="50" y="300" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1"/>
  <text x="65" y="320" fill="#0074FF" font-family="monospace" font-size="10">3D Particle System — Firefly Swarm</text>
  <text x="65" y="338" fill="#fff" font-family="monospace" font-size="11">A magical firefly-inspired particle swarm with bioluminescent green-gold points of light dancing in a dark forest atmosphere, each particle pulsing independently...</text>

  <rect x="415" y="300" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1"/>
  <text x="430" y="320" fill="#0074FF" font-family="monospace" font-size="10">3D Particle System — Data Stream</text>
  <text x="430" y="338" fill="#fff" font-family="monospace" font-size="11">A cyberpunk-inspired data stream visualization with cascading particles of light representing digital information flowing through a futuristic network matrix...</text>

  <rect x="50" y="390" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1" opacity=".65"/>
  <text x="65" y="410" fill="#ffd700" font-family="monospace" font-size="10">🔒 3D Particle System — Galaxy Spiral</text>
  <text x="65" y="428" fill="#fff" font-family="monospace" font-size="11">A breathtaking spiral galaxy particle simulation with thousands of stars arranged in majestic galactic arms rotating around a bright core center...</text>

  <rect x="415" y="390" width="345" height="75" rx="12" fill="rgba(5,12,24,.6)" stroke="rgba(0,116,255,.25)" stroke-width="1" opacity=".65"/>
  <text x="430" y="410" fill="#ffd700" font-family="monospace" font-size="10">🔒 3D Particle System — Bubbles</text>
  <text x="430" y="428" fill="#fff" font-family="monospace" font-size="11">A playful bubble particle system featuring iridescent translucent spheres floating upward with realistic light refraction and soft popping animations...</text>

  <rect x="50" y="430" width="700" height="40" rx="12" fill="rgba(5,12,24,.7)" stroke="rgba(0,116,255,.4)" stroke-width="1"/>
  <text x="400" y="455" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">© 2026 Ayman Elmasry — AEL Digital Studio | 3D Particle Backgrounds Library</text>
